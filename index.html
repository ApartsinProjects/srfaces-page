</style>

const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){
  const raw=b64d(PAYLOAD), salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITERS,hash:"SHA-256"},
             km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
  return new TextDecoder().decode(pt);
}

  document.close();}
async function attempt(pw){
  try{const html=await decrypt(pw); try{sessionStorage.setItem("k",pw)}catch(e){}; render(html);}
  catch(e){document.getElementById("err").textContent="Wrong password.";}
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();attempt(document.getElementById("pw").value);});
